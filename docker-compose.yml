services:
  bot:
    image: ghcr.io/smart7even/smart7even/schedule-bot/bot:${SCHEDULE_IMAGE_TAG:-latest}
    restart: always
    environment:
      - SCHEDULE_BOT_TOKEN=${SCHEDULE_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
  server:
    image: ghcr.io/smart7even/smart7even/schedule-bot/server:${SCHEDULE_IMAGE_TAG:-latest}
    restart: always
    ports:
      - 8000:8000
    environment:
      - SCHEDULE_BOT_TOKEN=${SCHEDULE_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  initializer:
    image: ghcr.io/smart7even/smart7even/schedule-bot/initializer:${SCHEDULE_IMAGE_TAG:-latest}
    environment:
      - SCHEDULE_BOT_TOKEN=${SCHEDULE_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
  maintenance:
    image: ghcr.io/smart7even/smart7even/schedule-bot/maintenance:${SCHEDULE_IMAGE_TAG:-latest}
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
      - SCHEDULE_OBSERVATION_INTERVAL=3600
      - GROUP_SYNC_INTERVAL=86400
    depends_on:
      - db
  db:
    image: postgres:15.4
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
