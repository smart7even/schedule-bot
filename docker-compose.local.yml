services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile-bot
    restart: always
    environment:
      - SCHEDULE_BOT_TOKEN=${SCHEDULE_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    restart: always
    ports:
      - 8000:8000
    environment:
      - SCHEDULE_BOT_TOKEN=${SCHEDULE_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
  initializer:
    build:
      context: .
      dockerfile: Dockerfile-initializer
    environment:
      - SCHEDULE_BOT_TOKEN=${SCHEDULE_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile-maintenance
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TZ=Europe/Moscow
      - SCHEDULE_OBSERVATION_INTERVAL=3600
      - GROUP_SYNC_INTERVAL=86400
    depends_on:
      - db
  db:
    image: postgres:15.4
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
